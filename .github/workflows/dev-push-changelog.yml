# Dev Push Changelog
# push 到 dev → 创建 changelog 分支 → 更新 CHANGELOG.md → 提 PR 回 dev
# 跳过 merge commit 和 bot 提交，避免 PR 合并时重复触发

name: 'Dev Push Changelog'

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  update-changelog:
    if: |
      !startsWith(github.event.head_commit.message, 'Merge pull request') &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      # 1. 生成分支名 & 更新 CHANGELOG → 2. 提交推送新分支
      - name: Update CHANGELOG and push branch
        id: push
        run: |
          BRANCH="changelog/$(date +'%Y%m%d-%H%M%S')"
          TS="$(date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "ts=${TS}" >> "$GITHUB_OUTPUT"

          cat > packages/cherry-markdown/CHANGELOG.md <<EOF
          # Changelog

          > Auto-generated at ${TS}

          Last updated: ${TS}
          EOF
          sed -i 's/^          //' packages/cherry-markdown/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/cherry-markdown/CHANGELOG.md
          git commit -m "chore: update \`CHANGELOG.md\` to ${TS}"
          git push origin "$BRANCH"

      # 3. 创建 PR 合并回 dev
      - name: Create PR
        id: create-pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.push.outputs.branch }}';
            const ts = '${{ steps.push.outputs.ts }}';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: update \`CHANGELOG.md\` to ${ts}`,
              head: branch,
              base: 'dev',
              body: `🤖 Auto-generated changelog update\n\n**Timestamp**: \`${ts}\`\n**Branch**: \`${branch}\``,
            });
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_number', pr.number);

      # 4. 自动合并 PR 并删除分支
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.create-pr.outputs.pr_number }};
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
            });
            console.log(`Merged PR #${prNumber}`);

            // 删除远程分支
            const branch = '${{ steps.push.outputs.branch }}';
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch ${branch}`);
            } catch (e) {
              console.log(`Branch cleanup skipped: ${e.message}`);
            }
